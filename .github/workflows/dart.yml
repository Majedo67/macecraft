name: MaceCraft

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: MaceCraft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Macecraft.xcodeproj -scheme Macecraft \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Macecraft.app Payload/
          zip -qq -r -9 MaceCraft.ipa Payload

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: MaceCraft.ipa
          tag: v1.0
          overwrite: true
          body: "MaceCraft build"
