name: MaceCraft

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: MaceCraft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create --platforms=ios --project-name macecraft --org com.example .

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 MaceCraft.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/MaceCraft.ipa
          tag: v1.0
          overwrite: true
          body: "MaceCraft build"
